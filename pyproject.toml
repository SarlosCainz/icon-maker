[project]
name = "icon-maker"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.1",
    "pillow>=11.1.0",
    "uwsgi>=2.0.28",
    "wand>=0.6.13",
]

[dependency-groups]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "imagemagick: ImageMagick (Wand) が必要なテスト",
]
