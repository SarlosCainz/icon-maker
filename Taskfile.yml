version: 3

vars:
  NAME: icon-maker
  VERSION: 1.0.10
  # 既定は arm64。別のアーキテクチャで動かす場合は task build PLATFORM=linux/amd64 で上書きする
  PLATFORM: linux/arm64
  IMAGE: "{{ .NAME }}:{{ .VERSION }}"

tasks:
  build-ui:
    desc: ui をビルドする (npm install && npm run build)
    dir: ui
    cmds:
      - npm install
      - npm run build

  build:
    desc: ui のビルドから docker build まで行い icon-maker:<VERSION> を作る
    cmds:
      - task: build-ui
      - uv pip compile pyproject.toml > requirements.txt
      # provenance attestation を付けるとレジストリ側のエントリが 1 回の push で 3 つ増えるため無効化する
      - docker build --platform {{ .PLATFORM }} --provenance=false -t {{ .IMAGE }} .
